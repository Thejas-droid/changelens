worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1m;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  limit_req_zone $binary_remote_addr zone=analysis:1m rate=10r/m;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;
    location / {
      try_files $uri $uri/ /index.html;
    }
    location /api/ {
      limit_req zone=analysis burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://server:8080;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 10s;
    }
    location /health/ { proxy_pass http://server:8080; access_log off; }
  }
}
