services:
  server:
    build: .
    restart: unless-stopped
    environment:
      TESTGRAPH_HOST: "0.0.0.0"
      TESTGRAPH_PORT: "8080"
      TESTGRAPH_REPOSITORY_PATH: /repository
      TESTGRAPH_API_TOKEN_FILE: /run/secrets/api_token
    secrets:
      - api_token
    volumes:
      - type: bind
        source: ${TESTGRAPH_REPOSITORY_PATH:-.}
        target: /repository
        read_only: true
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  dashboard:
    build:
      context: web/dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TESTGRAPH_DASHBOARD_PORT:-3000}:8080"
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  api_token:
    environment: TESTGRAPH_API_TOKEN
